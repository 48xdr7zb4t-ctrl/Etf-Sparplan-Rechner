<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ETF-Rechner komplett</title>
<style>
body { font-family: Arial; background:#f4f4f4; margin:0; padding:0; min-height:100vh; display:flex; justify-content:center; align-items:center; }
.container { max-width:1100px; width:100%; padding:40px; }
.box { background:white; padding:25px; border-radius:12px; margin-bottom:20px; display:flex; flex-direction:column; align-items:center; }
.box-small { max-width:420px; width:100%; margin:0 auto; }
input, button { width:100%; padding:10px; margin-top:10px; }
button { background:#4CAF50; color:white; border:none; cursor:pointer; }

.strategy-grid { display:flex; justify-content:center; gap:15px; margin-top:20px; flex-wrap:wrap; }
.strategy-card { border:2px solid #ddd; border-radius:12px; padding:20px; cursor:pointer; text-align:center; min-width:120px; }
.strategy-card.active { border-color:#4CAF50; background:#f1fbf3; }

table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { padding:10px; border-bottom:1px solid #ddd; text-align:center; }

.etf-row { cursor:pointer; transition: background 0.2s, border-left 0.2s; }
.etf-row:hover { background:#f5f5f5; }
.etf-row.selected { background:#e8f5e9; border-left:6px solid #4CAF50; }
.etf-row input[type="radio"] { transform: scale(1.2); }

.result-container { display:flex; gap:30px; flex-wrap:wrap; }
.result-box { flex:2; }
.info-box { flex:1; background:#fafafa; padding:20px; border-radius:10px; }

#etf-box { align-items:flex-start; }
#etf-box h2 { align-self:center; margin-bottom:20px; }
#etf-tables { width:100%; display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<div class="container">

<!-- 1. Modus Auswahl -->
<div class="box box-small" id="mode-box">
    <h2>Was möchtest du berechnen?</h2>
    <div class="strategy-grid">
        <div class="strategy-card" onclick="selectMode('endkapital', this)">Endkapital</div>
        <div class="strategy-card" onclick="selectMode('sparrate', this)">Benötigte Sparrate</div>
        <div class="strategy-card" onclick="selectMode('ansparzeit', this)">Benötigte Ansparzeit</div>
    </div>
</div>

<!-- 2. Eingabemaske -->
<div class="box box-small" id="input-box" style="display:none;">
    <h2 id="input-title"></h2>
    <div id="inputs-container"></div>
    <button onclick="goToStrategy()">Weiter</button>
</div>

<!-- 3. Strategieauswahl -->
<div class="box box-small" id="strategy-box" style="display:none;">
    <h2>ETF-Strategie auswählen</h2>
    <div class="strategy-grid">
        <div class="strategy-card" onclick="selectStrategy(1)">1 ETF<br><strong>100%</strong></div>
        <div class="strategy-card" onclick="selectStrategy(2)">2 ETFs<br><strong>70 / 30</strong></div>
        <div class="strategy-card" onclick="selectStrategy(3)">3 ETFs<br><strong>50 / 30 / 20</strong></div>
    </div>
    <button onclick="goToEtfs()">Weiter</button>
</div>

<!-- 4. ETF-Auswahl -->
<div class="box" id="etf-box" style="display:none;">
    <h2>ETF-Auswahl</h2>
    <div id="etf-tables"></div>
    <button onclick="berechnen()">Berechnen</button>
</div>

<!-- 5. Ergebnis -->
<div class="box" id="ergebnis-box" style="display:none;">
    <h2>Ergebnis – Szenariovergleich</h2>
    <div class="result-container">
        <div class="result-box">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>Schlechtester Fall</th>
                        <th>Durchschnitt</th>
                        <th>Bester Fall</th>
                    </tr>
                </thead>
                <tbody id="vergleich"></tbody>
            </table>
        </div>
        <div class="info-box">
            <h3>Deine Eingaben</h3>
            <div id="info-inputs"></div>
            <hr>
            <h3>Deine ETF-Allokation</h3>
            <div id="info-etfs"></div>
        </div>
    </div>
</div>

<script>
let mode = null;
let strategy = null;


// --- ETF Daten ---
const etfData = {
    world5:[{wkn:"A2PKXG",name:"Vanguard FTSE All-World",ter:0.0019,pos:"3.622"},{wkn:"A1JJTD",name:"SPDR MSCI All Country World",ter:0.0017,pos:"4.225"},{wkn:"A0RPWH",name:"iShares Core MSCI World",ter:0.0020,pos:"1.322"},{wkn:"A1XB5U",name:"Xtrackers MSCI World",ter:0.0012,pos:"1.454"},{wkn:"A2N6CW",name:"SPDR MSCI World",ter:0.0012,pos:"1.313"}],
    world3:[{wkn:"A2PKXG",name:"Vanguard FTSE All-World",ter:0.0019,pos:"3.622"},{wkn:"A1JJTD",name:"SPDR MSCI All Country World",ter:0.0017,pos:"4.225"},{wkn:"WELT0A",name:"L&G Gerd Kommer Multifactor Equity",ter:0.0045,pos:"4.105"}],
    em3:[{wkn:"A0RPWJ",name:"iShares MSCI EM",ter:0.0018,pos:"1.193"},{wkn:"A1JCMZ",name:"HSBC MSCI Emerging Markets",ter:0.0015,pos:"1.196"},{wkn:"A1JJTE",name:"SPDR MSCI Emerging Markets",ter:0.0018,pos:"1.167"},{wkn:"A2QAFK",name:"iShares MSCI EM ex-China",ter:0.0018,pos:"637"}],
    variable4:[{wkn:"A0RPWG",name:"iShares Core MSCI Europe",ter:0.0012,pos:"403"},{wkn:"A0YEDG",name:"iShares Core S&P 500 UCITS ETF",ter:0.0007,pos:"503"},{wkn:"A2DWBY",name:"iShares MSCI World Small Cap",ter:0.0035,pos:"3.400"}]
};
const weights = {1:[1],2:[0.7,0.3],3:[0.5,0.3,0.2]};

// --- Zinsen Szenarien ---
function getZinsen(jahre){
    if(jahre<=5) return [-0.42,0.07,0.39];
    if(jahre<=10) return [-0.05,0.067,0.25];
    if(jahre<=15) return [-0.02,0.07,0.16];
    if(jahre<=20) return [0.01,0.074,0.15];
    if(jahre<=25) return [0.02,0.075,0.13];
    if(jahre<=30) return [0.05,0.076,0.12];
    if(jahre<=35) return [0.05,0.075,0.09];
    if(jahre<=40) return [0.06,0.074,0.08];
    return [0.06,0.069,0.08];
}

// --- Berechnungsfunktionen ---
function berechneFV(pv, pmt, zins, jahre){
    if(zins === 0) return pv + pmt * 12 * jahre;
    let monatszins = zins / 12;
    let monate = jahre * 12;
    return pv * Math.pow(1 + monatszins, monate) + pmt * (Math.pow(1 + monatszins, monate) - 1) / monatszins;
}
function berechneJahre(pv, pmt, ziel, zins){
    if(zins === 0) return (ziel - pv) / (pmt * 12);
    let monatszins = zins / 12;
    return Math.log((ziel * monatszins + pmt) / (pv * monatszins + pmt)) / (12 * Math.log(1 + monatszins));
}

// --- Modus Auswahl ---
function selectMode(m, el){
    mode = m;
    document.querySelectorAll("#mode-box .strategy-card").forEach(c=>c.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("mode-box").style.display="none";
    const container = document.getElementById("inputs-container");
    container.innerHTML="";
    if(mode=="endkapital"){
        document.getElementById("input-title").innerText="Endkapital berechnen";
        container.innerHTML=`
            <input id="pv" type="number" placeholder="Startkapital (€)">
            <input id="pmt" type="number" placeholder="Monatliche Sparrate (€)">
            <input id="jahre" type="number" placeholder="Anlagedauer (Jahre)">
            <input id="zins" type="number" placeholder="Jahreszins optional (%)">`;
    }
    if(mode=="sparrate"){
        document.getElementById("input-title").innerText="Benötigte Sparrate berechnen";
        container.innerHTML=`
            <input id="pv" type="number" placeholder="Startkapital (€)">
            <input id="ziel" type="number" placeholder="Zielkapital (€)">
            <input id="jahre" type="number" placeholder="Anlagedauer (Jahre)">
            <input id="zins" type="number" placeholder="Jahreszins optional (%)">`;
    }
    if(mode=="ansparzeit"){
        document.getElementById("input-title").innerText="Benötigte Ansparzeit berechnen";
        container.innerHTML=`
            <input id="pv" type="number" placeholder="Startkapital (€)">
            <input id="pmt" type="number" placeholder="Monatliche Sparrate (€)">
            <input id="ziel" type="number" placeholder="Zielkapital (€)">
            <input id="zins" type="number" placeholder="Jahreszins optional (%)">`;
    }
    document.getElementById("input-box").style.display="block";
}

// --- Strategie Auswahl ---
function selectStrategy(n){
    strategy = n;
    document.querySelectorAll("#strategy-box .strategy-card")
        .forEach(c => c.classList.remove("active"));
    document.querySelectorAll("#strategy-box .strategy-card")[n-1]
        .classList.add("active");
}
function goToStrategy(){
    if(!mode){
        alert("Bitte zuerst einen Modus auswählen");
        return;
    }
    document.getElementById("input-box").style.display="none";
    document.getElementById("strategy-box").style.display="block";
}

// --- ETF Auswahl ---
function goToEtfs(){
    if(!strategy){ alert("Bitte Strategie auswählen"); return;}
    document.getElementById("strategy-box").style.display="none";
    const container = document.getElementById("etf-tables");
    container.innerHTML="";
    if(strategy==1) container.innerHTML+=createTable("World ETF 100%", etfData.world3,"etf1");
    if(strategy==2){ container.innerHTML+=createTable("World ETF 70%", etfData.world5,"etf2w"); container.innerHTML+=createTable("EM ETF 30%", etfData.em3,"etf2em"); }
    if(strategy==3){ container.innerHTML+=createTable("World ETF 50%", etfData.world5,"etf3w"); container.innerHTML+=createTable("EM ETF 30%", etfData.em3,"etf3em"); container.innerHTML+=createTable("Beliebiger ETF 20%", etfData.variable4,"etf3s"); }
    document.getElementById("etf-box").style.display="block";
}
function createTable(title, etfs, name){
    let html=`<h3>${title}</h3><table><thead><tr><th></th><th>WKN</th><th>Name</th><th>TER</th><th>Aktien</th></tr></thead><tbody>`;
    etfs.forEach((e,i)=> html+=`<tr class="etf-row"><td><input type="radio" name="${name}" value="${i}"></td><td>${e.wkn}</td><td>${e.name}</td><td>${(e.ter*100).toFixed(2)}%</td><td>${e.pos}</td></tr>`);
    html+="</tbody></table>";
    return html;
}
document.addEventListener("click", e=>{
    const row = e.target.closest(".etf-row");
    if(!row) return;
    const radio = row.querySelector("input[type='radio']");
    if(!radio) return;
    const name = radio.name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(r=>r.closest("tr").classList.remove("selected"));
    radio.checked=true;
    row.classList.add("selected");
});

// --- Berechnen ---
function berechnen(){
    const PV = parseFloat(document.getElementById("pv")?.value) || 0;
    const PMT_INPUT = parseFloat(document.getElementById("pmt")?.value) || 0;
    const ziel = parseFloat(document.getElementById("ziel")?.value) || 0;
    const jahre = parseFloat(document.getElementById("jahre")?.value) || 0;
    const zins = parseFloat(document.getElementById("zins")?.value) / 100 || 0;

    // ETFs & TER
    let selectedETFs = [];
    if(strategy==1){
        const i=document.querySelector('input[name="etf1"]:checked')?.value;
        if(i===undefined){ alert("ETF auswählen"); return; }
        selectedETFs.push({...etfData.world3[i],weight:1});
    }
    if(strategy==2){
        const w=document.querySelector('input[name="etf2w"]:checked')?.value;
        const e=document.querySelector('input[name="etf2em"]:checked')?.value;
        if(w===undefined||e===undefined){ alert("Beide ETFs auswählen"); return; }
        selectedETFs.push({...etfData.world5[w],weight:0.7});
        selectedETFs.push({...etfData.em3[e],weight:0.3});
    }
    if(strategy==3){
        const w=document.querySelector('input[name="etf3w"]:checked')?.value;
        const e=document.querySelector('input[name="etf3em"]:checked')?.value;
        const s=document.querySelector('input[name="etf3s"]:checked')?.value;
        if(w===undefined||e===undefined||s===undefined){ alert("Alle ETFs auswählen"); return; }
        selectedETFs.push({...etfData.world5[w],weight:0.5});
        selectedETFs.push({...etfData.em3[e],weight:0.3});
        selectedETFs.push({...etfData.variable4[s],weight:0.2});
    }

    const gesamtTER = selectedETFs.reduce((sum,e)=>sum + e.ter * e.weight, 0);
    const [rw,ra,rb] = zins>0 ? [zins,zins,zins] : getZinsen(jahre);

    function calc(r){
        let end = 0;
        let dauer = jahre;
        let PMT = PMT_INPUT;
        let einzahlungen = 0;

        // --- Endkapital ---
        if(mode==="endkapital"){
            end = berechneFV(PV, PMT, r, jahre);
            einzahlungen = PV + PMT * 12 * jahre;
        }

        // --- Sparrate ---
        if(mode==="sparrate"){
            let guess = 100;
            for(let i=0;i<50;i++){
                let fv = berechneFV(PV, guess, r, jahre);
                let ein = PV + guess * 12 * jahre;
                let kosten = fv * gesamtTER * jahre;
                let gewinn = Math.max(0, fv - ein);
                let steuer = gewinn * 0.25 * 0.7;
                let net = fv - kosten - steuer;
                guess *= ziel / net;
            }
            PMT = guess;
            end = berechneFV(PV, PMT, r, jahre);
            einzahlungen = PV + PMT * 12 * jahre;
        }

        // --- Ansparzeit ---
        if(mode==="ansparzeit"){
            dauer = berechneJahre(PV, PMT, ziel, r);
            end = ziel;
            einzahlungen = PV + PMT * 12 * dauer;
        }

        // --- Kosten & Steuern (NUR auf Gewinn) ---
        const kosten = end * gesamtTER * dauer;
        const gewinn = Math.max(0, end - einzahlungen);
        const steuer = gewinn * 0.25 * 0.7;
        const net = end - kosten - steuer;

        return { end, kosten, steuer, net, dauer, PMT };
    }

    const w = calc(rw);
    const a = calc(ra);
    const b = calc(rb);

    document.getElementById("etf-box").style.display="none";
    document.getElementById("ergebnis-box").style.display="block";

    let vergleichHTML = "";

   // --- Hilfsfunktion für deutsche Euro-Darstellung ---
function euro(x){
    return x.toLocaleString("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " €";
}

// --- Vergleichstabelle ---
if(mode==="ansparzeit"){
    vergleichHTML = `
    <tr><td>Benötigte Jahre</td>
        <td>${w.dauer.toFixed(2)}</td>
        <td>${a.dauer.toFixed(2)}</td>
        <td>${b.dauer.toFixed(2)}</td>
    </tr>`;
} else if(mode==="sparrate"){
    vergleichHTML = `
    <tr><td>Monatliche Sparrate</td>
        <td>${euro(w.PMT)}</td>
        <td>${euro(a.PMT)}</td>
        <td>${euro(b.PMT)}</td>
    </tr>`;
} else {
    vergleichHTML = `
    <tr><td>Endkapital</td>
        <td>${euro(w.end)}</td>
        <td>${euro(a.end)}</td>
        <td>${euro(b.end)}</td>
    </tr>
    <tr><td>TER-Kosten</td>
        <td>${euro(w.kosten)}</td>
        <td>${euro(a.kosten)}</td>
        <td>${euro(b.kosten)}</td>
    </tr>
    <tr><td>Steuern (nur Gewinn)</td>
        <td>${euro(w.steuer)}</td>
        <td>${euro(a.steuer)}</td>
        <td>${euro(b.steuer)}</td>
    </tr>
    <tr><th>Netto-Endkapital</th>
        <th>${euro(w.net)}</th>
        <th>${euro(a.net)}</th>
        <th>${euro(b.net)}</th>
    </tr>`;
}




/* ====== HIER BEGINNT DER FIX ====== */

// Zusätzlicher Text nur beim Endkapital-Modus
const extraTextContainer = document.getElementById("ergebnis-box");
const existingText = document.getElementById("endkapital-text");
if(existingText) existingText.remove();

if(mode === "endkapital") {
    const p = document.createElement("div");
    p.id = "endkapital-text";
    p.innerHTML = `
        <p style="margin-top:20px; font-style:italic;">
        Jährliche Vorabpauschale ca. 20€ pro 10.000 €;<br>
        Jährlicher Freibetrag von 1.000€/ 2.000€ bei Verheirateten
        </p>`;
    extraTextContainer.appendChild(p);
}

// --- Hilfsfunktion für deutsche Euro-Darstellung ---
function euro(x){
    return x.toLocaleString("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " €";
}

// --- Eingaben anzeigen ---
// --- Eingaben anzeigen inklusive investiertes Kapital ---
let infoHTML = `<p><strong>Modus:</strong> ${mode}</p>`;

if(mode=="endkapital"||mode=="sparrate")
    infoHTML += `<p><strong>Startkapital:</strong> ${euro(PV)}</p>`;

if(mode=="endkapital")
    infoHTML += `<p><strong>Monatliche Sparrate:</strong> ${euro(PMT_INPUT)}</p>
                 <p><strong>Anlagedauer:</strong> ${jahre} Jahre</p>`;

if(mode=="sparrate")
    infoHTML += `<p><strong>Zielkapital:</strong> ${euro(ziel)}</p>
                 <p><strong>Anlagedauer:</strong> ${jahre} Jahre</p>`;

if(mode=="ansparzeit")
    infoHTML += `<p><strong>Monatliche Sparrate:</strong> ${euro(PMT_INPUT)}</p>
                 <p><strong>Zielkapital:</strong> ${euro(ziel)}</p>
                 <p><strong>Benötigte Dauer:</strong> ${a.dauer.toFixed(2)} Jahre</p>`;

if(zins>0)
    infoHTML += `<p><strong>Jahreszins:</strong> ${(zins*100).toFixed(2)}%</p>`;

// --- Investiertes Kapital berechnen ---
let investiertesKapital = PV + PMT_INPUT * 12 * jahre;
infoHTML += `<p><strong>Investiertes Kapital:</strong> ${euro(investiertesKapital)}</p>`;


document.getElementById("info-inputs").innerHTML = infoHTML;

// --- ETF-Allokation anzeigen inklusive Betrag ---
const etfBox = document.getElementById("info-etfs");
etfBox.innerHTML = "";

// Gesamtinvestition: Startkapital + monatliche Sparrate * Monate
let gesamtInvest = PV + PMT_INPUT * 12 * jahre;

selectedETFs.forEach(e=>{
    let invest = gesamtInvest * e.weight;  // Betrag pro ETF
    etfBox.innerHTML += `
        <p>
            <strong>${(e.weight*100).toFixed(0)}%</strong> 
            ${e.name}<br>
            <small>WKN: ${e.wkn} – TER: ${(e.ter*100).toFixed(2)}%</small>
        </p>`;
});

    document.getElementById("vergleich").innerHTML = vergleichHTML;
}

/* ====== FIX ENDE ====== */
</script>
</body>
</html>
